# Garage on one node for the benchmarks (`garage server --single-node`).
metadata_dir = "/data/meta"
data_dir = "/data/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# Benchmark-only: the node talks to nobody.
rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
