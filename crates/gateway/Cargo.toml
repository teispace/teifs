[package]
name = "teifs-gateway"
description = "File-protocol gateways to TeiFS's S3 service: SFTP, WebDAV and FTPS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
teifs-s3.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sts.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types = { version = "1.9", features = ["http-body-1-x"] }
aws-lc-rs.workspace = true
bytes.workspace = true
http = "1"
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
# SSH with aws-lc-rs's cryptography; no `rsa` crate (RUSTSEC-2023-0071), so RSA keys
# aren't offered or taken.
russh = { version = "0.65.2", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "3.0.1"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
