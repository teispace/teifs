[package]
name = "teifs-iam"
description = "TeiFS's IAM: users, access keys, groups and policies, and who signed a request"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
teifs-meta.workspace = true
teifs-crypto.workspace = true
teifs-policy.workspace = true
teifs-types.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
form_urlencoded.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
ldap3.workspace = true
hickory-resolver.workspace = true
ldap3_proto = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time", "net", "rt"] }
tracing.workspace = true
zeroize.workspace = true

[features]
# The fake LDAP directory (`ldap::fake`), for other crates' tests.
fake-ldap = ["dep:ldap3_proto", "dep:tokio-util", "dep:futures"]

[dev-dependencies]
ldap3_proto.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
futures.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
