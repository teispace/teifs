# `helm test RELEASE`: the server answers its health check through its Service.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "teifs.fullname" . }}-test
  labels:
    {{- include "teifs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - health
        - "{{ include "teifs.scheme" . | lower }}://{{ include "teifs.fullname" . }}:{{ .Values.service.port }}"
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
