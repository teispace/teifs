apiVersion: v1
kind: Service
metadata:
  name: {{ include "teifs.fullname" . }}
  labels:
    {{- include "teifs.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "teifs.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.port }}
      targetPort: s3
      protocol: TCP
---
# The StatefulSet's own: a stable name for its pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teifs.fullname" . }}-headless
  labels:
    {{- include "teifs.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "teifs.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
