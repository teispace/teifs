{{- if not .Values.auth.existingSecret }}
{{- /* The generated keys are kept across upgrades: a new pair would lock clients out. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "teifs.fullname" .) }}
{{- $access := .Values.auth.accessKey | default (printf "teifs-%s" (randAlphaNum 12 | lower)) }}
{{- $secret := randAlphaNum 40 }}
{{- if $existing }}
{{- $access = index $existing.data .Values.auth.accessKeyKey | b64dec }}
{{- $secret = index $existing.data .Values.auth.secretKeyKey | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teifs.fullname" . }}
  labels:
    {{- include "teifs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.auth.accessKeyKey }}: {{ $access | b64enc | quote }}
  {{ .Values.auth.secretKeyKey }}: {{ $secret | b64enc | quote }}
{{- end }}
