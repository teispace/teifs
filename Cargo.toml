[workspace]
resolver = "3"
members = ["crates/store", "crates/s3", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/teispace/teidrive"
authors = ["Teispace <info@teispace.com>"]
publish = false

[workspace.dependencies]
teidrive-store = { path = "crates/store" }
teidrive-s3 = { path = "crates/s3" }

s3s = "0.17"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
hyper-util = { version = "0.1.20", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
md-5 = "0.11"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.6", features = ["derive", "env"] }
async-trait = "0.1"
base64 = "0.23"
tempfile = "3"
aws-sdk-s3 = { version = "1.150", features = ["behavior-version-latest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
