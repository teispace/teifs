[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/teispace/teifs"
authors = ["Teispace <info@teispace.com>"]
publish = false

[workspace.dependencies]
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
teifs-types = { path = "crates/types" }
teifs-meta = { path = "crates/meta" }
teifs-crypto = { path = "crates/crypto" }
teifs-store = { path = "crates/store" }
teifs-s3 = { path = "crates/s3" }
teifs-server = { path = "crates/server" }
teifs-policy = { path = "crates/policy" }
teifs-iam = { path = "crates/iam" }
teifs-client = { path = "crates/client" }
teifs-notify = { path = "crates/notify" }

s3s = "0.17"
# s3s's form parser: the same one reads a browser upload's fields before s3s does.
s3s-multipart = "0.17"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
hyper-util = { version = "0.1.20", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
md-5 = "0.11"
# S3's additional checksums, the same crates s3s uses (so no new code is trusted).
crc-fast = "1.10"
# Kafka targets' gzip.
flate2 = "1.1"
# Inventory reports in ORC and Parquet: Arrow batches, written by orc-rust (which pins
# Arrow's version) and parquet with Snappy.
arrow-array = "59"
arrow-schema = "59"
orc-rust = { version = "0.9", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
snap = "1.1"
lz4_flex = { version = "0.14", default-features = false, features = ["frame", "safe-encode", "safe-decode", "checked-decode", "std"] }
zstd = { version = "0.14", default-features = false }
sha1 = "0.11"
sha2 = "0.11"
xxhash-rust = { version = "0.8.17", features = ["std", "xxh64", "xxh3"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aws-lc-rs = "1.18"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-native-certs = "0.8"
aws-smithy-http-client = { version = "1.4", default-features = false, features = ["rustls-aws-lc"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
zeroize = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v7"] }
clap = { version = "4.6", features = ["derive", "env", "string"] }
clap_complete = "4.6"
mimalloc = { version = "0.1.52", default-features = false }
toml = "1.1"
dirs = "7"
anstream = "1"
anstyle = "1"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
unicode-width = "0.2"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
async-trait = "0.1"
base64 = "0.23"
tempfile = "3"
aws-sdk-s3 = { version = "1.150", default-features = false, features = ["behavior-version-latest", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sigv4 = { version = "1", default-features = false, features = ["http1"] }
aws-credential-types = "1"
aws-sdk-s3control = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.122", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-config = { version = "1.12", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "sso"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
ipnet = "2.11"
form_urlencoded = "1"
percent-encoding = "2"
httpdate = "1"
x509-parser = { version = "0.18", default-features = false }
prometheus-client = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Request data never panics the server: no unwrap outside tests. `expect` is allowed
# only for invariants, with a message saying which (CONVENTIONS.md).
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
