name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    # New advisories against dependencies that haven't changed.
    name: Security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  s3-tests:
    # The ceph/s3-tests suite on each bucket layout: every test in
    # tests/s3-tests/implemented.txt must pass (folder buckets skip folder-excluded.txt).
    name: S3 compatibility, ${{ matrix.layout }} buckets (ceph/s3-tests)
    strategy:
      fail-fast: false
      matrix:
        layout: [object, folder]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: tests/s3-tests/run.sh
        env:
          S3TESTS_LAYOUT: ${{ matrix.layout }}
          # Outside target/, which the Rust cache saves and restores.
          S3TESTS_WORK: ${{ runner.temp }}/s3-tests
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s3-tests-report-${{ matrix.layout }}
          path: |
            ${{ runner.temp }}/s3-tests/report.xml
            ${{ runner.temp }}/s3-tests/pytest.log
            ${{ runner.temp }}/s3-tests/server.log

  clients:
    # Real clients doing what people do with them (tests/clients): the AWS CLI, rclone,
    # restic and Kopia (with Object Lock), boto3, the Go and JavaScript SDKs, and
    # Terraform's S3 backend.
    name: Clients, ${{ matrix.layout }} buckets
    strategy:
      fail-fast: false
      matrix:
        layout: [object, folder]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: tests/clients/install-ci.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tests/clients/run.sh
        env:
          CLIENTS_REQUIRE: "1"
          CLIENTS_LAYOUT: ${{ matrix.layout }}
          CLIENTS_WORK: ${{ runner.temp }}/clients
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clients-logs-${{ matrix.layout }}
          path: ${{ runner.temp }}/clients/*.log
      - name: Report a failure as an issue
        # One open issue per layout, commented on at each failing night.
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Client matrix fails on ${{ matrix.layout }} buckets"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "The nightly client matrix failed: $RUN. Logs are attached to the run."
          fi

  helm:
    # The chart on a kind cluster, with an image built from source.
    name: Helm chart on Kubernetes (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: kind and helm, pinned
        env:
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "$KIND_SHA256  kind" | sha256sum --check --strict
          install -m 0755 kind bin/kind
          curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "$HELM_SHA256  helm.tar.gz" | sha256sum --check --strict
          tar -xzf helm.tar.gz -C bin --strip-components 1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The image, from a static binary built here
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --release --locked -p teifs --target x86_64-unknown-linux-musl
          mkdir -p ctx/empty ctx/linux-amd64
          cp target/x86_64-unknown-linux-musl/release/teifs ctx/linux-amd64/
          docker build --build-arg TARGETARCH=amd64 -f docker/Dockerfile -t teifs:test ctx
      - run: packaging/helm/test-kind.sh

  crash-and-properties:
    # Longer runs of what every pull request checks briefly: writes killed at 200
    # moments (on Linux and ext4 here), and property tests with 50 times the cases.
    name: Crash consistency and property tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --release -p teifs-store --test crash -- --nocapture
        env:
          TEIFS_CRASH_ROUNDS: 200
      - run: >-
          cargo test --locked --release -p teifs-types -p teifs-store -p teifs-s3 --lib --
          properties stay_inside agrees_with_a_strict_reading follow_s3s_rules
        env:
          PROPTEST_CASES: 25000

  power-loss:
    # The same writes on LazyFS, a FUSE file system that keeps unsynced data in its own
    # cache and throws it away when told: each kill is a power cut as well.
    name: Power loss (LazyFS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LAZYFS_COMMIT: fa7d32ee9710d55a7e529ac3c375f6616563c78b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build LazyFS
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libfuse3-dev fuse3
          sudo sed -i '/user_allow_other/s/^#//' /etc/fuse.conf
          git init -q "$RUNNER_TEMP/lazyfs"
          cd "$RUNNER_TEMP/lazyfs"
          git fetch -q --depth 1 https://github.com/dsrhaslab/lazyfs "$LAZYFS_COMMIT"
          git checkout -q FETCH_HEAD
          (cd libs/libpcache && ./build.sh)
          (cd lazyfs && ./build.sh)
      - name: Mount LazyFS
        run: |
          mkfifo "$RUNNER_TEMP/faults.fifo" "$RUNNER_TEMP/done.fifo"
          mkdir -p "$RUNNER_TEMP/lazyfs.mnt" "$RUNNER_TEMP/lazyfs.root"
          cat > "$RUNNER_TEMP/lazyfs.toml" <<EOF
          [faults]
          fifo_path="$RUNNER_TEMP/faults.fifo"
          fifo_path_completed="$RUNNER_TEMP/done.fifo"
          [cache]
          apply_eviction=false
          [cache.simple]
          custom_size="2gb"
          blocks_per_page=1
          [filesystem]
          log_all_operations=false
          logfile=""
          EOF
          cd "$RUNNER_TEMP/lazyfs/lazyfs"
          # One FUSE thread: with several, LazyFS's cache locks can deadlock under the
          # writers' mix of creates, writes and lookups (an lfs_create waiting for a
          # file's lock while lfs_write and lfs_getattr calls wait for the cache's).
          ./scripts/mount-lazyfs.sh -s -c "$RUNNER_TEMP/lazyfs.toml" \
            -m "$RUNNER_TEMP/lazyfs.mnt" -r "$RUNNER_TEMP/lazyfs.root"
          for _ in $(seq 30); do mountpoint -q "$RUNNER_TEMP/lazyfs.mnt" && break; sleep 1; done
          mountpoint "$RUNNER_TEMP/lazyfs.mnt"
          mkdir "$RUNNER_TEMP/lazyfs.mnt/run"
      - run: cargo test --locked --release -p teifs-store --test crash -- --nocapture
        env:
          TEIFS_CRASH_ROUNDS: 200
          TEIFS_CRASH_DIR: ${{ runner.temp }}/lazyfs.mnt/run
          TEIFS_CRASH_POWER: ${{ runner.temp }}/faults.fifo|${{ runner.temp }}/done.fifo
      - name: Where a stalled round waits
        # The test's watchdog exits and leaves the writer and LazyFS as they were: their
        # threads' kernel and user stacks tell a TeiFS deadlock from a stuck FUSE call.
        if: failure()
        timeout-minutes: 5
        run: |
          sudo apt-get install -y gdb > /dev/null
          for pid in $(pgrep -f 'deps/crash-') $(pgrep -x lazyfs); do
            echo "== $pid: $(tr '\0' ' ' < "/proc/$pid/cmdline")"
            for task in /proc/"$pid"/task/*; do
              echo "-- $(cat "$task/comm") state $(awk '{print $3}' "$task/stat") in $(sudo cat "$task/wchan")"
              sudo cat "$task/stack" || true
            done
            timeout 60 sudo gdb -p "$pid" -batch -ex 'thread apply all bt' 2>/dev/null \
              | grep -E '^Thread|^#' | head -400 || true
          done
      - if: always()
        run: fusermount3 -u "$RUNNER_TEMP/lazyfs.mnt" || true

  external-kms:
    # Encryption with real external KMSes: an OpenBao transit engine, KES, and Moto for
    # AWS KMS (LocalStack needs an account since March 2026).
    name: External KMS (OpenBao, KES, AWS KMS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      openbao:
        image: openbao/openbao:latest
        env:
          BAO_DEV_ROOT_TOKEN_ID: dev-only-token
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
      moto:
        image: motoserver/moto:latest
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: tests/kms/start-kes.sh
      - run: cargo test --locked -p teifs-server --test external_kms -- --nocapture
        env:
          TEIFS_TEST_TRANSIT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: dev-only-token
          TEIFS_TEST_AWS_KMS_ENDPOINT: http://127.0.0.1:5000
          AWS_ACCESS_KEY_ID: dummy-test-key
          AWS_SECRET_ACCESS_KEY: dummy-test-secret
          AWS_REGION: us-east-1

  ldap:
    # LDAP sign-in (AssumeRoleWithLDAPIdentity) against a real OpenLDAP: MinIO's test
    # image, which seeds its users and groups a few seconds after it starts.
    name: LDAP sign-in (OpenLDAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      openldap:
        image: quay.io/minio/openldap:latest
        env:
          LDAP_ORGANIZATION: MinIO Inc
          LDAP_DOMAIN: min.io
          LDAP_ADMIN_PASSWORD: admin
        ports:
          - 389:389
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked -p teifs-server --test ldap -- --nocapture
        env:
          TEIFS_TEST_LDAP_SERVER: 127.0.0.1:389

  kafka:
    # Notifications to a real Kafka broker: plain, SASL PLAIN and SCRAM, gzip; the records
    # are read back with Kafka's own consumer.
    name: Kafka notifications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:4.1.0
        env:
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,SASL_PLAINTEXT://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,SASL_PLAINTEXT://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
          KAFKA_LISTENER_NAME_SASL__PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required user_teifs="plain-test-only";
          KAFKA_LISTENER_NAME_SASL__PLAINTEXT_SCRAM___SHA___256_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
          KAFKA_LISTENER_NAME_SASL__PLAINTEXT_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          # The image refuses a SASL listener without KAFKA_OPTS (meant for a JAAS file);
          # the listener's own JAAS settings above are used instead.
          KAFKA_OPTS: -Djava.net.preferIPv4Stack=true
        ports:
          - 9092:9092
          - 9094:9094
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The topic and the SCRAM user
        env:
          KAFKA: docker exec ${{ job.services.kafka.id }} /opt/kafka/bin
        run: |
          for i in $(seq 60); do
            $KAFKA/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && break
            sleep 2
          done
          $KAFKA/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic teifs-events --partitions 3 --replication-factor 1
          # One credential per request: Kafka refuses two for a user in one.
          for mechanism in SCRAM-SHA-256 SCRAM-SHA-512; do
            $KAFKA/kafka-configs.sh --bootstrap-server localhost:9092 --alter --entity-type users --entity-name teifs \
              --add-config "$mechanism=[iterations=4096,password=scram-test-only]"
          done
      - run: cargo test --locked -p teifs-server --test kafka -- --nocapture
        env:
          TEIFS_TEST_KAFKA: 127.0.0.1:9092
          TEIFS_TEST_KAFKA_SASL: 127.0.0.1:9094
          TEIFS_TEST_KAFKA_PLAIN_PASSWORD: plain-test-only
          TEIFS_TEST_KAFKA_SCRAM_PASSWORD: scram-test-only
      - name: The records, as Kafka's consumer reads them
        env:
          KAFKA: docker exec ${{ job.services.kafka.id }} /opt/kafka/bin
        run: |
          $KAFKA/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic teifs-events \
            --from-beginning --max-messages 12 --timeout-ms 30000 --property print.key=true --property key.separator='|' > records.txt
          cut -c1-160 records.txt
          test "$(wc -l < records.txt)" -eq 12
          for bucket in kafka0 kafka1 kafka2 kafka3; do
            test "$(grep -c "^$bucket/a.txt|" records.txt)" -eq 2
            grep -q "^$bucket/dir/b c.txt|.*s3:ObjectCreated:Put" records.txt
            grep -q "^$bucket/a.txt|.*s3:ObjectRemoved:Delete" records.txt
          done

  rabbitmq:
    # Notifications to a real RabbitMQ: declared and checked exchanges, confirms, a
    # refused login; the messages are read back through its management API.
    name: AMQP notifications (RabbitMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: teifs
          RABBITMQ_DEFAULT_PASS: amqp-test-only
        ports:
          - 5672:5672
          - 15672:15672
    env:
      API: http://127.0.0.1:15672/api
      LOGIN: teifs:amqp-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The exchange, bound to a queue
        run: |
          for i in $(seq 60); do curl -sf -u "$LOGIN" "$API/overview" >/dev/null && break; sleep 2; done
          curl -sf -u "$LOGIN" -X PUT -H 'content-type: application/json' "$API/exchanges/%2F/teifs" -d '{"type":"direct","durable":true}'
          curl -sf -u "$LOGIN" -X PUT -H 'content-type: application/json' "$API/queues/%2F/teifs-events" -d '{"durable":true}'
          curl -sf -u "$LOGIN" -X POST -H 'content-type: application/json' "$API/bindings/%2F/e/teifs/q/teifs-events" -d '{"routing_key":"events"}'
      - run: cargo test --locked -p teifs-server --test amqp -- --nocapture
        env:
          TEIFS_TEST_AMQP: amqp://127.0.0.1:5672
          TEIFS_TEST_AMQP_PASSWORD: amqp-test-only
      - name: The messages, as RabbitMQ keeps them
        run: |
          curl -sf -u "$LOGIN" -X POST -H 'content-type: application/json' "$API/queues/%2F/teifs-events/get" \
            -d '{"count":20,"ackmode":"ack_requeue_false","encoding":"auto"}' > messages.json
          jq -c '.[] | [.properties.delivery_mode, .properties.headers, (.payload | fromjson | .Key)]' messages.json
          test "$(jq length messages.json)" -eq 6
          test "$(jq '[.[] | select(.properties.delivery_mode == 2 and .properties.content_type == "application/json")] | length' messages.json)" -eq 6
          for bucket in declared checked; do
            test "$(jq --arg b "$bucket" '[.[] | select(.properties.headers["minio-bucket"] == $b)] | length' messages.json)" -eq 3
          done

  postgres:
    # Notifications to a real PostgreSQL, signed in with SCRAM-SHA-256: tables TeiFS
    # makes, a row per object and a row per event, a refused password; the rows are
    # read back with psql.
    name: PostgreSQL notifications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teifs
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_DB: teifs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teifs" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked -p teifs-server --test postgres -- --nocapture
        env:
          TEIFS_TEST_POSTGRES: 127.0.0.1:5432
          TEIFS_TEST_POSTGRES_PASSWORD: postgres-test-only
      - name: The rows, as PostgreSQL keeps them
        env:
          PSQL: docker exec ${{ job.services.postgres.id }} psql -U teifs -d teifs -tAX -c
        run: |
          $PSQL "SELECT key, value->'Records'->0->>'eventName' FROM teifs_objects"
          test "$($PSQL "SELECT key FROM teifs_objects")" = "objects/dir/b c.txt"
          test "$($PSQL "SELECT count(*) FROM teifs_log")" -eq 3
          test "$($PSQL "SELECT count(*) FROM teifs_log WHERE event_data->>'EventName' = 's3:ObjectRemoved:Delete'")" -eq 1
          test "$($PSQL "SELECT pg_typeof(event_time) FROM teifs_log LIMIT 1")" = "timestamp with time zone"
          test "$($PSQL "SELECT count(*) FROM pg_tables WHERE tablename = 'teifs_wrong'")" -eq 0

  mysql:
    # Notifications to a real MySQL (caching_sha2_password: the password sent encrypted
    # with the server's RSA key, given or asked for) and MariaDB (mysql_native_password):
    # tables TeiFS makes, a row per object and a row per event, a refused password; the
    # rows are read back with the server's own client.
    name: MySQL notifications (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            image: mysql:8.4
            client: mysql
            key: /var/lib/mysql/public_key.pem
          - name: MariaDB 11.4
            image: mariadb:11.4
            client: mariadb
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_DATABASE: teifs
          MYSQL_USER: teifs
          MYSQL_PASSWORD: mysql-test-only
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The server, over TCP
        env:
          SQL: docker exec -e MYSQL_PWD=mysql-test-only ${{ job.services.db.id }} ${{ matrix.client }} -h127.0.0.1 --protocol=TCP -uteifs teifs -N -B -e
        run: |
          for i in $(seq 90); do $SQL "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done
          $SQL "SELECT VERSION(), @@default_authentication_plugin" 2>/dev/null || $SQL "SELECT VERSION()"
      - name: The server's RSA key
        if: matrix.key
        run: |
          docker cp ${{ job.services.db.id }}:${{ matrix.key }} public_key.pem
          echo "TEIFS_TEST_MYSQL_PUBLIC_KEY=$PWD/public_key.pem" >> "$GITHUB_ENV"
      - run: cargo test --locked -p teifs-server --test mysql -- --nocapture
        env:
          TEIFS_TEST_MYSQL: 127.0.0.1:3306
          TEIFS_TEST_MYSQL_PASSWORD: mysql-test-only
      - name: The rows, as the server keeps them
        env:
          SQL: docker exec -e MYSQL_PWD=mysql-test-only ${{ job.services.db.id }} ${{ matrix.client }} -h127.0.0.1 --protocol=TCP -uteifs teifs -N -B -e
        run: |
          $SQL "SELECT key_name, JSON_UNQUOTE(JSON_EXTRACT(value, '$.Records[0].eventName')) FROM teifs_objects"
          test "$($SQL "SELECT key_name FROM teifs_objects")" = "objects/dir/b c.txt"
          test "$($SQL "SELECT COUNT(*) FROM teifs_log")" -eq 3
          test "$($SQL "SELECT COUNT(*) FROM teifs_log WHERE JSON_UNQUOTE(JSON_EXTRACT(event_data, '$.EventName')) = 's3:ObjectRemoved:Delete'")" -eq 1
          test "$($SQL "SELECT COUNT(*) FROM information_schema.tables WHERE table_name = 'teifs_wrong'")" -eq 0

  brokers:
    # Notifications to real NSQ, Redis, NATS (JetStream) and MQTT servers, each over TLS
    # verified with a CA made here; what each got is read back with its own tools.
    name: Notifications to NSQ, Redis, NATS and MQTT (TLS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: A CA, and a certificate for localhost it signed
        run: |
          mkdir certs && cd certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 2 -subj /CN=teifs-test-ca
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj /CN=localhost
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 2 -extfile ext.cnf
          chmod 644 ./*
      - name: The servers, each requiring TLS
        run: |
          C="$PWD/certs"
          docker run -d --name nsqd -p 4150:4150 -p 4151:4151 -v "$C:/certs:ro" nsqio/nsq:v1.3.0 \
            /nsqd --tls-cert=/certs/server.pem --tls-key=/certs/server.key --tls-required=tcp-https
          docker run -d --name redis -p 6380:6380 -v "$C:/certs:ro" redis:7.4 redis-server --port 0 \
            --tls-port 6380 --tls-cert-file /certs/server.pem --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/ca.pem --tls-auth-clients no --requirepass redis-test-only
          docker run -d --name nats -p 4222:4222 -p 8222:8222 -v "$C:/certs:ro" nats:2.11 -js -m 8222 \
            --tls --tlscert /certs/server.pem --tlskey /certs/server.key --user teifs --pass nats-test-only
          printf '%s\n' 'allow_anonymous false' 'password_file /certs/passwd' \
            'listener 8883' 'cafile /certs/ca.pem' 'certfile /certs/server.pem' 'keyfile /certs/server.key' \
            'listener 8884' 'protocol websockets' 'cafile /certs/ca.pem' 'certfile /certs/server.pem' \
            'keyfile /certs/server.key' > "$C/mosquitto.conf"
          docker run --rm -v "$C:/certs" eclipse-mosquitto:2 sh -c \
            'mosquitto_passwd -b -c /certs/passwd teifs mqtt-test-only && chown mosquitto /certs/passwd && chmod 0700 /certs/passwd'
          docker run -d --name mqtt -p 8883:8883 -p 8884:8884 -v "$C:/certs" eclipse-mosquitto:2 mosquitto -c /certs/mosquitto.conf
          for port in 4150 6380 4222 8883 8884; do
            for _ in $(seq 60); do (echo > "/dev/tcp/127.0.0.1/$port") 2>/dev/null && break; sleep 1; done
          done
          docker run --rm --network host -v "$C:/certs:ro" natsio/nats-box:latest nats --server tls://localhost:4222 \
            --tlsca /certs/ca.pem --user teifs --password nats-test-only stream add S3 --subjects s3.events --defaults
          docker exec -d mqtt sh -c 'mosquitto_sub --cafile /certs/ca.pem -h localhost -p 8883 -u teifs \
            -P mqtt-test-only -t s3/events -t s3/ws -q 2 -v -C 6 > /certs/mqtt.txt'
          sleep 2
      - run: cargo test --locked -p teifs-server --test brokers -- --nocapture
        env:
          TEIFS_TEST_BROKERS_CA: ${{ github.workspace }}/certs/ca.pem
          TEIFS_TEST_NSQ: localhost:4150
          TEIFS_TEST_REDIS: localhost:6380
          TEIFS_TEST_REDIS_PASSWORD: redis-test-only
          TEIFS_TEST_NATS: localhost:4222
          TEIFS_TEST_NATS_PASSWORD: nats-test-only
          TEIFS_TEST_MQTT: localhost:8883
          TEIFS_TEST_MQTT_WS: wss://localhost:8884/mqtt
          TEIFS_TEST_MQTT_PASSWORD: mqtt-test-only
      - name: What each server got
        run: |
          curl -sf 'http://127.0.0.1:4151/stats?format=json&topic=s3-events' > nsq.json
          test "$(jq '[.. | objects | select(.topic_name? == "s3-events") | .message_count] | first' nsq.json)" -eq 3
          docker exec redis redis-cli --tls --cacert /certs/ca.pem -h localhost -p 6380 -a redis-test-only \
            --no-auth-warning HKEYS teifs-events > redis.txt
          cat redis.txt
          test "$(cat redis.txt)" = "redis-events/dir/b c.txt"
          curl -sf 'http://127.0.0.1:8222/jsz?streams=true' > nats.json
          test "$(jq '[.. | objects | select(.name? == "S3") | .state.messages] | first' nats.json)" -eq 3
          for _ in $(seq 20); do [ "$(wc -l < certs/mqtt.txt)" -ge 6 ] && break; sleep 1; done
          cut -c1-120 certs/mqtt.txt
          test "$(grep -c '^s3/events ' certs/mqtt.txt)" -eq 3
          test "$(grep -c '^s3/ws ' certs/mqtt.txt)" -eq 3
          grep -q '^s3/ws .*"EventName":"s3:ObjectRemoved:Delete"' certs/mqtt.txt
      - name: The servers' logs
        if: failure()
        run: for c in nsqd redis nats mqtt; do echo "== $c"; docker logs "$c" 2>&1 | tail -30; done
