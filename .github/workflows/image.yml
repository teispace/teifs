name: Image

# Publishes ghcr.io/teispace/teifs (linux/amd64, linux/arm64) for a published release,
# built from that release's own static binaries after checking their checksums and
# build provenance, so the image runs exactly what the release ships. Tags: 0.1.0, 0.1,
# and latest when it's the latest release. Run it by hand (Actions ▸ Image ▸ Run
# workflow, tag v0.1.0) once the release is published.
#
# Pull requests that change the image build it from source for linux/amd64 and check it
# serves, is healthy and keeps its data, without pushing anything.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
  pull_request:
    paths:
      - .github/workflows/image.yml
      - docker/Dockerfile

permissions:
  contents: read

concurrency:
  group: image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build${{ github.event_name == 'workflow_dispatch' && ' and publish' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The release's binaries, verified
        if: env.PUBLISH == 'true'
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Not a release tag: $INPUT_TAG"; exit 1
          fi
          if [ "$(gh release view "$INPUT_TAG" --json isDraft -q .isDraft)" != false ]; then
            echo "::error::$INPUT_TAG isn't published yet"; exit 1
          fi
          version=${INPUT_TAG#v}
          gh release download "$INPUT_TAG" -D rel \
            -p "teifs-$version-*-unknown-linux-musl.tar.gz" -p SHA256SUMS.txt
          (cd rel && sha256sum --check --ignore-missing --strict SHA256SUMS.txt)
          for f in rel/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          mkdir -p ctx/empty
          for arch in x86_64:amd64 aarch64:arm64; do
            dir="ctx/linux-${arch#*:}"
            mkdir -p "$dir"
            tar -xzf "rel/teifs-$version-${arch%:*}-unknown-linux-musl.tar.gz" \
              -C "$dir" --strip-components 1 "teifs-$version-${arch%:*}-unknown-linux-musl/teifs"
            test -x "$dir/teifs"
          done
          latest=$(gh release view --json tagName -q .tagName)
          {
            echo "tag=$INPUT_TAG"
            echo "version=$version"
            echo "latest=$([ "$INPUT_TAG" = "$latest" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: A static binary from source (pull requests)
        if: env.PUBLISH != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --release --locked -p teifs --target x86_64-unknown-linux-musl
          mkdir -p ctx/empty ctx/linux-amd64
          cp target/x86_64-unknown-linux-musl/release/teifs ctx/linux-amd64/

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag || 'v0.0.0' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag || 'v0.0.0' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=TeiFS
            org.opencontainers.image.description=Your folders as a drive and as S3: an S3-compatible server and client in one binary.
            org.opencontainers.image.vendor=Teispace
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          annotations: |
            org.opencontainers.image.description=Your folders as a drive and as S3: an S3-compatible server and client in one binary.
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: teifs:test
          load: true

      - name: Smoke test
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION" ]; then
            docker run --rm teifs:test --version | tee /dev/stderr | grep -qx "teifs $VERSION"
          fi
          docker volume create teifs-data
          docker volume create teifs-config
          run() {
            docker run -d --name teifs -p 127.0.0.1:9000:9000 \
              -v teifs-data:/data -v teifs-config:/config \
              -e TEIFS_ACCESS_KEY=image-test -e TEIFS_SECRET_KEY=image-test-secret teifs:test
          }
          healthy() {
            for _ in $(seq 60); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' teifs)" = healthy ] && return 0
              sleep 1
            done
            docker logs teifs; return 1
          }
          run
          healthy
          docker logs teifs 2>&1 | grep -q "Serving /data over S3"
          export AWS_ACCESS_KEY_ID=image-test AWS_SECRET_ACCESS_KEY=image-test-secret
          export AWS_DEFAULT_REGION=us-east-1 AWS_ENDPOINT_URL=http://127.0.0.1:9000
          echo "kept" > kept.txt
          aws s3 mb s3://smoke
          aws s3 cp kept.txt s3://smoke/kept.txt
          # A new container on the same volumes has the same data, still decryptable.
          docker rm -f teifs
          run
          healthy
          aws s3 cp s3://smoke/kept.txt - | grep -qx kept
          docker exec teifs /usr/local/bin/teifs --version
          [ "$(docker exec teifs /usr/local/bin/teifs -q health && echo ok)" = ok ]
          [ "$(docker inspect -f '{{.Config.User}}' teifs)" = nonroot:nonroot ]
          docker rm -f teifs

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish both platforms
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Build provenance for the image
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
